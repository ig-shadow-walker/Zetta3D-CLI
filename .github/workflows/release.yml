name: Release

# Push a tag like v0.2.0 (or v0.2.0-beta.1 for a prerelease) to build, scan and publish a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Keep in step with ci.yml.
  BUN_VERSION: 1.4.2

jobs:
  build:
    name: Build, sign, scan
    # macOS cross-compiles every target, can fix up the ad-hoc signature of the macOS binaries,
    # and is where codesign/notarytool live for real signing.
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run lint

      - name: Version from tag
        id: version
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "prerelease=true" ;; *) echo "prerelease=false" ;; esac >> "$GITHUB_OUTPUT"
          pkg=$(bun -e 'console.log(require("./packages/cli/package.json").version)')
          if [ "$pkg" != "$v" ]; then
            echo "::warning::Tag $GITHUB_REF_NAME does not match packages/cli/package.json ($pkg); building $v."
          fi

      # All release targets, plus x64 builds for CPUs without AVX2 (old hardware, some VMs and
      # emulators); the installers and `zetta upgrade` pick those automatically when needed.
      - name: Build binaries
        run: bun run scripts/build-binaries.ts --version "${{ steps.version.outputs.version }}" --baseline

      # ---------------------------------------------------------------------------------------
      # macOS signing + notarisation. DISABLED until the owner adds these secrets:
      #   APPLE_CERTIFICATE_P12_BASE64   Developer ID Application certificate + key, .p12, base64
      #   APPLE_CERTIFICATE_PASSWORD     password of that .p12
      #   APPLE_KEYCHAIN_PASSWORD        any random string (temporary keychain on the runner)
      #   APPLE_SIGNING_IDENTITY         e.g. "Developer ID Application: <Company> (<TEAMID>)"
      #   APPLE_ID                       Apple ID used for notarisation
      #   APPLE_TEAM_ID                  10-character team id
      #   APPLE_APP_SPECIFIC_PASSWORD    app-specific password for that Apple ID
      # To enable: uncomment the step below. The entitlements are the ones Bun's JIT needs.
      # ---------------------------------------------------------------------------------------
      # - name: Sign and notarise macOS binaries
      #   env:
      #     APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #     APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      #     VERSION: ${{ steps.version.outputs.version }}
      #   run: |
      #     set -euo pipefail
      #     KEYCHAIN="$RUNNER_TEMP/zetta-signing.keychain-db"
      #     echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
      #     security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security set-keychain-settings -lut 21600 "$KEYCHAIN"
      #     security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
      #     security set-key-partition-list -S apple-tool:,apple: -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN"
      #     security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
      #     cat > "$RUNNER_TEMP/entitlements.plist" <<'EOF'
      #     <?xml version="1.0" encoding="UTF-8"?>
      #     <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
      #     <plist version="1.0"><dict>
      #       <key>com.apple.security.cs.allow-jit</key><true/>
      #       <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
      #       <key>com.apple.security.cs.disable-executable-page-protection</key><true/>
      #       <key>com.apple.security.cs.allow-dyld-environment-variables</key><true/>
      #       <key>com.apple.security.cs.disable-library-validation</key><true/>
      #     </dict></plist>
      #     EOF
      #     for f in dist/v$VERSION/zetta-darwin-*; do
      #       codesign --force --timestamp --options runtime --entitlements "$RUNNER_TEMP/entitlements.plist" \
      #         --sign "$APPLE_SIGNING_IDENTITY" "$f"
      #       codesign --verify --strict --verbose=2 "$f"
      #       ditto -c -k --keepParent "$f" "$RUNNER_TEMP/$(basename "$f").zip"
      #       xcrun notarytool submit "$RUNNER_TEMP/$(basename "$f").zip" --wait \
      #         --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD"
      #     done
      #     # A bare executable cannot be stapled; Gatekeeper checks the notarisation ticket online.
      #     security delete-keychain "$KEYCHAIN"

      # ---------------------------------------------------------------------------------------
      # Windows Authenticode signing. DISABLED until the owner adds these secrets:
      #   WINDOWS_CERTIFICATE_PFX_BASE64  code-signing certificate + key, .pfx, base64
      #   WINDOWS_CERTIFICATE_PASSWORD    password of that .pfx
      # Uses jsign, which runs here on macOS. New OV/EV certificates live on hardware or cloud
      # HSMs (e.g. Azure Trusted Signing, a cloud KMS): jsign supports those too by changing
      # --storetype/--keystore, with secrets such as WINDOWS_SIGNING_ACCOUNT / WINDOWS_SIGNING_TOKEN.
      # ---------------------------------------------------------------------------------------
      # - name: Sign Windows binaries
      #   env:
      #     WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #     VERSION: ${{ steps.version.outputs.version }}
      #   run: |
      #     set -euo pipefail
      #     brew install jsign
      #     echo "$WINDOWS_CERTIFICATE_PFX_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.pfx"
      #     for f in dist/v$VERSION/zetta-windows-*.exe; do
      #       jsign --storetype PKCS12 --keystore "$RUNNER_TEMP/cert.pfx" --storepass "$WINDOWS_CERTIFICATE_PASSWORD" \
      #         --tsaurl http://timestamp.digicert.com --name "Zetta 3D CLI" --url https://zetta3d.ai "$f"
      #     done
      #     rm -f "$RUNNER_TEMP/cert.pfx"

      # Signing changes the bytes, so checksums and latest.json are always recomputed here.
      - name: Recompute SHA256SUMS and latest.json
        run: bun run scripts/build-binaries.ts --version "${{ steps.version.outputs.version }}" --rehash

      - name: Vendor-name scan
        env:
          ZETTA_VENDOR_WORDS: ${{ secrets.ZETTA_VENDOR_WORDS }}
        run: bun run scan:vendor --require-list --require-bundle

      # The real installer against these exact files, served from 127.0.0.1.
      - name: Installer end-to-end against the release build
        run: bun run scripts/test-install.ts --from-dist

      # dist/bundle/ (scan input) is deliberately not part of the release.
      - uses: actions/upload-artifact@v4
        with:
          name: zetta-release-${{ steps.version.outputs.version }}
          path: |
            dist/latest.json
            dist/v${{ steps.version.outputs.version }}/
          retention-days: 30
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: zetta-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "zetta $VERSION" \
            --generate-notes \
            "${flags[@]}" \
            dist/v"$VERSION"/* dist/latest.json

  # -----------------------------------------------------------------------------------------
  # Upload to the download host (S3-compatible storage, e.g. Cloudflare R2, AWS S3, B2).
  # DISABLED BY DEFAULT. To enable, the owner:
  #   1. adds repository secrets ZETTA_S3_ACCESS_KEY_ID, ZETTA_S3_SECRET_ACCESS_KEY,
  #      ZETTA_S3_ENDPOINT (e.g. https://<account-id>.r2.cloudflarestorage.com; empty for AWS)
  #      and ZETTA_S3_BUCKET;
  #   2. optionally sets repository variables ZETTA_S3_PREFIX (default "cli") and
  #      ZETTA_S3_REGION (default "auto");
  #   3. sets the repository variable ZETTA_SYNC_DOWNLOADS to "true".
  # Objects end up at <bucket>/<prefix>/latest.json, <prefix>/v<version>/..., <prefix>/install.sh
  # and <prefix>/install.ps1, which the bucket's public domain must serve as
  # https://downloads.zetta3d.ai/cli/... (see install/README.md).
  # -----------------------------------------------------------------------------------------
  sync-download-host:
    name: Sync download host
    needs: [build, github-release]
    if: ${{ vars.ZETTA_SYNC_DOWNLOADS == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: zetta-release-${{ needs.build.outputs.version }}
          path: dist

      - name: Upload
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ZETTA_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ZETTA_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.ZETTA_S3_REGION || 'auto' }}
          # Some S3-compatible stores reject the newer default checksum headers of aws-cli v2.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          S3_ENDPOINT: ${{ secrets.ZETTA_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.ZETTA_S3_BUCKET }}
          S3_PREFIX: ${{ vars.ZETTA_S3_PREFIX || 'cli' }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          endpoint=()
          if [ -n "$S3_ENDPOINT" ]; then endpoint=(--endpoint-url "$S3_ENDPOINT"); fi
          dest="s3://$S3_BUCKET/$S3_PREFIX"

          # 1. The versioned folder first. It never changes after publishing, so cache it forever.
          aws s3 cp "dist/v$VERSION/" "$dest/v$VERSION/" --recursive --exclude SHA256SUMS "${endpoint[@]}" \
            --content-type application/octet-stream --cache-control "public, max-age=31536000, immutable"
          aws s3 cp "dist/v$VERSION/SHA256SUMS" "$dest/v$VERSION/SHA256SUMS" "${endpoint[@]}" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=31536000, immutable"

          # 2. The installers (text, so `irm | iex` gets a string). Short cache.
          aws s3 cp install/install.sh "$dest/install.sh" "${endpoint[@]}" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp install/install.ps1 "$dest/install.ps1" "${endpoint[@]}" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"

          # 3. latest.json last, so it never points at files that are not there yet.
          #    Prereleases do not move "latest"; install them with ZETTA_VERSION=<version>.
          if [ "$PRERELEASE" != true ]; then
            aws s3 cp dist/latest.json "$dest/latest.json" "${endpoint[@]}" \
              --content-type application/json --cache-control "public, max-age=60"
          fi
          # If a CDN sits in front of the bucket, purge latest.json here (placeholder).

  # -----------------------------------------------------------------------------------------
  # npm (`npx @zetta3d/cli`) and Homebrew (`brew install <tap>/zetta`). DISABLED BY DEFAULT.
  # npm:      add the secret NPM_TOKEN and set the variable ZETTA_PUBLISH_NPM to "true".
  # Homebrew: create the tap repository (e.g. zetta3d/homebrew-tap), add the secret
  #           ZETTA_TAP_TOKEN (a token that can push to it), and set the variable
  #           ZETTA_HOMEBREW_TAP to its name, e.g. "zetta3d/homebrew-tap".
  # Both are built from the release files by scripts/package-channels.ts.
  # -----------------------------------------------------------------------------------------
  npm-publish:
    name: Publish to npm
    needs: [build, github-release]
    if: ${{ vars.ZETTA_PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: zetta-release-${{ needs.build.outputs.version }}
          path: dist
      - run: bun run package:channels
      - name: Publish (platform packages first, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          set -euo pipefail
          tag=latest
          if [ "$PRERELEASE" = true ]; then tag=next; fi
          for dir in dist/npm/cli-*/ dist/npm/cli/; do
            (cd "$dir" && npm publish --access public --tag "$tag")
          done

  homebrew-tap:
    name: Update the Homebrew tap
    needs: [build, sync-download-host]
    if: ${{ vars.ZETTA_HOMEBREW_TAP != '' && needs.build.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v5
        with:
          name: zetta-release-${{ needs.build.outputs.version }}
          path: dist
      - run: bun run package:channels
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.ZETTA_HOMEBREW_TAP }}
          token: ${{ secrets.ZETTA_TAP_TOKEN }}
          path: tap
      - name: Commit the formula
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          cp dist/homebrew/zetta.rb tap/Formula/zetta.rb
          cd tap
          git config user.name "zetta-release"
          git config user.email "release@zetta3d.ai"
          git add Formula/zetta.rb
          git commit -m "zetta $VERSION" || echo "Formula unchanged."
          git push
